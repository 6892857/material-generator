<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Material Description Generator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    margin:0;
    padding:24px;
    background:#f5f6f8;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:24px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#0078d4;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:5px;
}

select,
input{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:4px;
}

.property{
    margin-bottom:15px;
}

small{
    color:#666;
}

.result{
    margin-top:20px;
    padding:15px;
    border:1px solid #0078d4;
    border-radius:6px;
    background:#eef6ff;
    font-size:18px;
    font-weight:bold;
    min-height:60px;
    word-break:break-all;
    line-height:1.6;
}

.buttons{
    margin-top:15px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    margin-right:10px;
}

.primary{
    background:#0078d4;
    color:white;
}

.success{
    background:#107c41;
    color:white;
}

.section{
    margin-top:20px;
}

#propertyContainer{
    margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h2>Material Description Generator</h2>

<div class="grid">

<div>
<label>Material Family</label>
<select id="familySelect"></select>
</div>

<div>
<label>Category</label>
<select id="categorySelect"></select>
</div>

<div>
<label>Sub Category</label>
<select id="subCategorySelect"></select>
</div>

</div>

<div class="section">

<label>Search Property</label>

<input
id="propertySearch"
placeholder="Search property..."
oninput="filterProperties()">

</div>

<div id="propertyContainer"></div>

<div class="buttons">

<button
class="primary"
onclick="generateDescription()">
Generate
</button>

<button
class="success"
onclick="copyDescription()">
Copy
</button>

</div>

<div
id="result"
class="result">
</div>

</div>

<script>

let materialData={};

fetch("materialData.json")
.then(response=>response.json())
.then(data=>{

    materialData=data;

    loadFamily();

});

function loadFamily(){

    const family =
        document.getElementById(
            "familySelect"
        );

    family.innerHTML="";

    Object.keys(materialData)
    .forEach(item=>{

        family.add(
            new Option(item,item)
        );

    });

    loadCategory();
}

document
.getElementById("familySelect")
.addEventListener(
    "change",
    loadCategory
);

function loadCategory(){

    const family =
        document
        .getElementById(
            "familySelect"
        ).value;

    const category =
        document
        .getElementById(
            "categorySelect"
        );

    category.innerHTML="";

    Object.keys(
        materialData[family]
    ).forEach(item=>{

        category.add(
            new Option(
                item,
                item
            )
        );

    });

    loadSubCategory();
}

document
.getElementById("categorySelect")
.addEventListener(
    "change",
    loadSubCategory
);

function loadSubCategory(){

    const family =
        document
        .getElementById(
            "familySelect"
        ).value;

    const category =
        document
        .getElementById(
            "categorySelect"
        ).value;

    const sub =
        document
        .getElementById(
            "subCategorySelect"
        );

    sub.innerHTML="";

    Object.keys(
        materialData
        [family]
        [category]
    ).forEach(item=>{

        sub.add(
            new Option(
                item,
                item
            )
        );

    });

    renderProperties();
}

document
.getElementById("subCategorySelect")
.addEventListener(
    "change",
    renderProperties
);

function renderProperties(){

    const family =
        document
        .getElementById(
            "familySelect"
        ).value;

    const category =
        document
        .getElementById(
            "categorySelect"
        ).value;

    const sub =
        document
        .getElementById(
            "subCategorySelect"
        ).value;

    const properties =
        materialData
        [family]
        [category]
        [sub]
        .properties;

    const container =
        document
        .getElementById(
            "propertyContainer"
        );

    container.innerHTML="";

    properties.forEach(
        (property,index)=>{

        const row =
            document
            .createElement("div");

        row.className =
            "property";

        let control="";

        const name =
            property.name;

        const config =
            property.configuration || "";

        const length =
            property.length || "";

        const unit =
            property.unit || "";

        if(
            property.lov &&
            property.lov.length>0
        ){

            control=
            `
            <select
                class="prop-input"
                data-unit="${unit}">

                ${property.lov
                .map(item=>`
                <option>
                    ${item}
                </option>
                `).join("")}

            </select>
            `;
        }
        else{

            const maxlength =
                /^\d+$/.test(length)
                ? `maxlength="${length}"`
                : "";

            control=
            `
            <input
                class="prop-input"
                ${maxlength}
                data-unit="${unit}"
                placeholder="${length}">
            `;
        }

        row.innerHTML=
        `
        <label>${name}</label>

        ${control}

        <small>

        Configuration:
        ${config || "Input"}

        ${unit ? "&nbsp;&nbsp;|&nbsp;&nbsp;Unit: "+unit : ""}

        ${length ? "&nbsp;&nbsp;|&nbsp;&nbsp;Format/Length: "+length : ""}

        </small>
        `;

        container.appendChild(
            row
        );
    });

    generateDescription();
}

function escapeHtml(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}

function generateDescription(){

    const subCategory =
        document
        .getElementById(
            "subCategorySelect"
        ).value;

    let result = [
        subCategory
    ];

    document
        .querySelectorAll(
            ".prop-input"
        )
        .forEach(item=>{

            const value =
                item.value.trim();

            const unit =
                item.dataset.unit || "";

            if(value){

                result.push(
                    value + unit
                );
            }
        });

    const description =
        result.join("-");

    const limit = 40;

    const resultDiv =
        document.getElementById(
            "result"
        );

    const lengthDiv =
        document.getElementById(
            "lengthInfo"
        );

    if(description.length <= limit){

        resultDiv.innerHTML =
            escapeHtml(description);

        lengthDiv.innerHTML =
            `Length : ${description.length}/${limit}`;

        lengthDiv.style.color =
            "#107c41";
    }
    else{

        const normalPart =
            escapeHtml(
                description.substring(
                    0,
                    limit
                )
            );

        const overflowPart =
            escapeHtml(
                description.substring(
                    limit
                )
            );

        resultDiv.innerHTML =
            `
            ${normalPart}
            <span style="
                color:red;
                font-weight:bold;">
                ${overflowPart}
            </span>
            `;

        lengthDiv.innerHTML =
            `
            Length : ${description.length}/${limit}
            ⚠ OVER LIMIT
            `;

        lengthDiv.style.color =
            "red";
    }
}

document
.addEventListener(
    "input",
    generateDescription
);

function copyDescription(){

    const text =
        document
        .getElementById(
            "result"
        )
        .innerText
        .trim();

    if(text.length > 40){

        alert(
            "Description exceeds 40 characters. Please shorten it before copying."
        );

        return;
    }

    navigator.clipboard
        .writeText(text);

    alert(
        "Description copied successfully."
    );
}

function filterProperties(){

    const keyword =
        document
        .getElementById(
            "propertySearch"
        )
        .value
        .toLowerCase();

    document
    .querySelectorAll(
        ".property"
    )
    .forEach(item=>{

        const text =
            item.innerText
            .toLowerCase();

        item.style.display =
            text.includes(keyword)
            ? ""
            : "none";

    });

}

</script>

</body>
</html>
